name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The test kit (fake phones) comes from otterbridge-allsense-protocol. Until allsense-testkit is on
      # PyPI it's installed from that repo; while the repo is private, add a read-only TESTKIT_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: wen-da-ng/otterbridge-allsense-protocol
          token: ${{ secrets.TESTKIT_TOKEN || github.token }}
          path: _testkit
      - run: pip install ./_testkit
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
