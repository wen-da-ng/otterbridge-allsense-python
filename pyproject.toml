[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "allsense"
version = "0.1.0"
description = "Stream sensors from an Android phone running OtterBridge AllSense into Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "wen-da-ng" }]
keywords = ["robotics", "sensors", "android", "imu", "websocket"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = ["websockets>=12"]

[project.optional-dependencies]
# Find phones on the network without typing their IP.
discovery = ["zeroconf>=0.100"]
numpy = ["numpy>=1.21"]
# Recordings → MCAP (Foxglove, ROS 2 bags): allsense mcap / export_mcap().
mcap = ["mcap>=1.1", "mcap-ros2-support>=0.5"]
all = ["zeroconf>=0.100", "numpy>=1.21", "mcap>=1.1", "mcap-ros2-support>=0.5"]
dev = ["pytest>=7", "allsense-testkit>=0.1", "numpy>=1.21", "zeroconf>=0.100", "mcap>=1.1", "mcap-ros2-support>=0.5"]

[project.scripts]
allsense = "allsense.cli:main"

[project.urls]
Source = "https://github.com/wen-da-ng/otterbridge-allsense-python"
Documentation = "https://docs.allsense.otterbridge.org/get-started/python/"
Issues = "https://github.com/wen-da-ng/otterbridge-allsense-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/allsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
